{
  "openapi": "3.1.0",
  "info": {
    "title": "DMD Media Showcase Server API",
    "summary": "DMD Media Showcase Server (MQTT Retain + Lossless HTTP DMDZ v2 / DMDS & Passive UDP DMDF) for HUB75 LED Matrices",
    "description": "Self-hosted multilingual media & video trailer streaming server for **ArcadeMatrix (ESP32 / ESP32-S3)** and **ArcadeMatrix_RPi** LED matrices.\n\n### Architecture Highlights\n- **Configurable Multi-Source Scraper Chains (`source_policies`)**: Ordered Primary/Secondary/Fallback chains per domain (`IGDB v4`, `ScreenScraper`, `ArcadeItalia`, `Libretro/Wikidata`, `TMDB`, `iTunes`, `TheTVDB v4`, `TVMaze`, `Jikan/AnimeThemes`, `AniList`) with automatic cross-source asset enrichment (`enrich_missing` -> composite `source_used` such as `igdb+arcadeitalia`).\n- **Strict Consume-Once (`seen_history.json`)**: Zero title repetition and immediate post-stream disk purge.\n- **Lossless 16-Bit True-RGB565 Streaming (`MQTT+TCP` Default)**: Real-time MQTT (`:1883`, `retain=True` + `LWT`) paired with:\n  1. **Plain HTTP `1.1` `Content-Length` Lossless `DMDZ` v2 / `DMDS` (`GET /api/v1/{domain}/stream/{item_id}.rgb565.stream?codec=dmdz2`)** — downloaded during the Info Card onto `esp32dev`'s `25 MHz` SD card (`0` Wi-Fi traffic during playback, Zero-Copy `SRAM1` Canvas), preloaded directly into `ESP32-S3` Octal PSRAM (`<= 4 MB`, or streamed via a `1 MB` PSRAM SPSC ring for oversized `256x64` HD clips), and preloaded into RAM on `ArcadeMatrix_RPi`,\n  2. **Passive UDP `DMDF` (`:4210`, `10`-byte Little-Endian `<4sHBBH` header + `<= 1408B` RGB565LE chunks)** — full AsyncAPI 2.6 spec at [`/asyncapi.yaml`](/asyncapi.yaml).",
    "version": "1.1.4"
  },
  "paths": {
    "/api/v1/asyncapi.yaml": {
      "get": {
        "tags": [
          "System & Admin"
        ],
        "summary": "Get AsyncAPI 2.6 Specification (MQTT 3.1.1 Control Plane & Passive UDP DMDF Streaming)",
        "description": "Serve the authoritative AsyncAPI 2.6.0 specification describing:\n- MQTT 3.1.1 retained & event channels (`status`, `referential`, `config`, `ready`, `events`, `command`, `stream_state`)\n- Plain HTTP `1.1` `Content-Length` lossless `DMDZ` v2 (`.dmdz2.stream`, `?codec=dmdz2`) & raw `DMDS` (`.rgb565.stream`) handoff\n- Real-time UDP `DMDF` binary frame chunk datagrams (`10`-byte Little-Endian `<4sHBBH` header + `<= 1408B` RGB565LE)",
        "operationId": "get_asyncapi_spec_api_v1_asyncapi_yaml_get",
        "responses": {
          "200": {
            "description": "AsyncAPI 2.6.0 YAML specification for MQTT `:1883` topics and UDP `DMDF` `<4sHBBH` frame datagrams.",
            "content": {
              "application/json": {
                "schema": {}
              },
              "application/yaml": {
                "schema": {
                  "type": "string"
                }
              }
            }
          }
        }
      }
    },
