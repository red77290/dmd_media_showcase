{
  "openapi": "3.1.0",
  "info": {
    "title": "DMD Media Showcase Server API",
    "summary": "DDD Media Showcase Server (MQTT Retain + UDP FFmpeg -re & HTTP Consume-Once) for HUB75 DMDs",
    "description": "Self-hosted multilingual media & video trailer streaming server for **ArcadeMatrix (ESP32 / ESP32-S3)** and **ArcadeMatrix_RPi** LED matrices.\n\n### V3.0 Architecture Highlights\n- **DDD Ports & Adapters (`IScraperSource`)**: 2 dedicated sources per domain (`Primary` + `Fallback`).\n- **Strict Consume-Once (`seen_history.json`)**: Zero title repetition and immediate post-stream disk purge.\n- **Dual Transport**: Real-time MQTT (`retain=True` + `LWT`) + `ffmpeg -re` UDP `DMDF` streaming (`10`-byte Little-Endian `<4sHBBH` header + `<= 1024B` RGB565LE chunks — full AsyncAPI 2.6 spec at [`/asyncapi.yaml`](/asyncapi.yaml)), plus HTTP `DMDS` Streaming (`16`-byte `<4sBBHHHHH` header).",
    "version": "3.0.0"
  },
  "paths": {
    "/api/v1/asyncapi.yaml": {
      "get": {
        "tags": [
          "System & Admin"
        ],
        "summary": "Get AsyncAPI 2.6 Specification (MQTT 3.1.1 & UDP DMDF Streaming)",
        "description": "Serve the authoritative AsyncAPI 2.6.0 specification describing:\n- MQTT 3.1.1 retained & event channels (`status`, `referential`, `config`, `ready`, `events`, `stream_state`)\n- Real-time UDP `DMDF` binary frame chunk datagrams (`10`-byte Little-Endian `<4sHBBH` header + `<= 1024B` RGB565LE)",
        "operationId": "get_asyncapi_spec_api_v1_asyncapi_yaml_get",
        "responses": {
          "200": {
            "description": "AsyncAPI 2.6.0 YAML specification for MQTT `:1883` topics and UDP `DMDF` `<4sHBBH` frame datagrams.",
            "content": {
              "application/json": {
                "schema": {}
              },
              "application/yaml": {
                "schema": {
                  "type": "string"
                }
              }
            }
          }
        }
      }
    },
