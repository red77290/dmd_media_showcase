    "/api/v1/{domain}/stream/{item_id}.rgb565.stream": {
      "get": {
        "tags": [
          "Consume-Once Protocol"
        ],
        "summary": "Stream Consume Once Sequence",
        "description": "Serve the unified lossless 16-bit True-RGB565 binary sequence\n(`Jacket Panorama -> Marquee Panorama -> Snapshots -> Video`) over plain HTTP `1.1` with\ndeterministic `Content-Length`:\n- **`esp32dev` (`0 KB` PSRAM)**: Downloads `?purge=false&codec=dmdz2` onto its `25 MHz` SD card\n  (`/cache/showcase_live.dmdz`) during the Info Card dwell, closes TCP (`0` Wi-Fi traffic during\n  playback), and decodes locally from SD into its Zero-Copy `SRAM1` Canvas.\n- **`ESP32-S3` (Octal PSRAM)**: Preloads `?purge=false&codec=dmdz2` (`<= 4 MB`) directly into PSRAM\n  during the Info Card (`0` Wi-Fi traffic during playback), or streams oversized `256x64` HD clips\n  into a `1 MB` PSRAM SPSC ring buffer.\n- **`ArcadeMatrix_RPi` (Linux RAM)**: Preloads `?purge=false&codec=dmdz2` (or raw `DMDS` when `codec`\n  is omitted) directly into RAM during the Info Card.\n\n### Binary Lossless `DMDZ` v2 Container (`codec=dmdz2` — `<4sBBHHHHH` 16-Byte Header)\n- `0..3`: `\"DMDZ\"`, `4`: `version` (`2`), `5`: `fps`, `6..7`: `width`, `8..9`: `height`,\n  `10..11`: `total_frames`, `12..13`: `frame_dur_ms`, `14..15`: `keyframe_interval`.\n- `16..EOF`: Per frame `<H` `payload_len` + lossless frame ops (`0=delta`, `1=scroll(dy)`,\n  `2=keyframe`, `3=scroll_2d(dx,dy)`, `4=raw`).\n\n### Binary Raw `DMDS` Container (`codec` omitted — `<4sBBHHHHH` 16 Bytes + RGB565LE Frames)\n- `0..3`: `\"DMDS\"`, `4`: `1`, `5`: `fps`, `6..7`: `width`, `8..9`: `height`, `10..11`: `total_frames`,\n  `12..13`: `frame_dur_ms`, `14..15`: `0`.",
        "operationId": "stream_consume_once_sequence_api_v1__domain__stream__item_id__rgb565_stream_get",
        "parameters": [
          {
            "name": "domain",
            "in": "path",
            "required": true,
            "schema": {
              "enum": [
                "games",
                "movies",
                "series",
                "anime"
              ],
              "type": "string",
              "title": "Domain"
            }
          },
          {
            "name": "item_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "title": "Item Id"
            }
          },
          {
            "name": "purge",
            "in": "query",
            "required": false,
            "schema": {
              "type": "boolean",
              "description": "Purge package from disk immediately after HTTP TCP response completes (pass purge=false when preloading before an explicit MQTT stop_stream or HTTP DELETE purge).",
              "default": true,
              "title": "Purge"
            },
            "description": "Purge package from disk immediately after HTTP TCP response completes (pass purge=false when preloading before an explicit MQTT stop_stream or HTTP DELETE purge)."
          },
          {
            "name": "codec",
            "in": "query",
            "required": false,
            "schema": {
