asyncapi: 2.6.0
info:
  title: DMD Media Showcase Server — MQTT 3.1.1 Control Plane, Paced TCP DMDS & Passive UDP DMDF Streaming Protocol
  version: 1.1.4
  description: |
    Asynchronous Control & Real-Time Binary Frame Streaming specification for **DMD Media Showcase Server**,
    powering **ArcadeMatrix (ESP32 / ESP32-S3)**, **Server-Managed Hybrid & Passive ESP32 Receivers**, and **ArcadeMatrix_RPi** HUB75 LED panels.

    ### Protocol Architecture
    1. **MQTT 3.1.1 Control Plane (`:1883`)**:
       - Uses `retain=True` for server availability (`dmd_showcase/server/status`), consolidated scraper
         referentials (`dmd_showcase/catalog/{domain}/referential`), client-driven DMD configurations
         (`dmd_showcase/clients/{dmd_id}/config`), server-managed hybrid/passive hardware announcements
         (`dmd_showcase/clients/{dmd_id}/hello`, persisted against `./data/dmd_profiles.json`), and per-domain
         prepared Consume-Once slots (`dmd_showcase/clients/{dmd_id}/{domain}/ready`) carrying compact
         collision-free `item_id` values (`pkg_<domain>_<12hex>`, `<= 24` chars).
       - Uses `dmd_showcase/clients/{dmd_id}/command` for real-time server-to-DMD live control and on-demand
         card push (`action: "play_card" | "skip" | "pause" | "resume" | "stop"`).
       - Uses `LWT` (Last Will and Testament) on both server and DMD clients for instant disconnect cleanup
         while preserving background `N+1` media transcoding tasks across rotation slot switches.
    2. **Primary Data Plane (`MQTT+TCP` Default — Models 1 & 2A, `supports_local_card: true`)**:
       - **Scoped MQTT + Real-Time Paced HTTP TCP `DMDS` Streaming (`:8890`)** (`transport: "mqtt_tcp"`, default):
         the DMD connects to MQTT (`:1883`), publishes `config` or `hello`, claims the retained `ready` slot via
         `{"action": "start_card", "item_id": "..."}`, disconnects MQTT on ESP32 to free
         LwIP socket buffers (`~4 KB`), and streams Phase 2 pixels over raw `HTTP/1.1` TCP (`lwip_socket`) via
         `GET /api/v1/{domain}/stream/{item_id}.rgb565.stream?purge=true&paced=1` (documented in `/openapi.json`).
       - Omitting `drop_late=1` preserves `Content-Length` so Uvicorn streams **100% raw unchunked binary `DMDS`** with
         `X-DMD-Paced: 1`, emits the **16-byte Little-Endian `<4sBBHHHHH` `DMDS` header**, paces every RGB565LE frame at
         `1 / fps` on a monotonic wall-clock (re-anchoring on jitter so ESP32 `TCP_WND` never stalls and zero client-side
         buffering heap is needed; optional `drop_late=1` omits `Content-Length` / enables `Transfer-Encoding: chunked`
         for full HTTP/1.1 chunk-decoding clients), and purges the `.rgb565.stream` cache file on EOF (`purge=true`).
       - Works identically across Docker Desktop / Rancher Desktop VM NAT and bare-metal Linux with zero UDP packet loss
         and zero MTU chunk reassembly overhead.
    3. **Passive Mode 2B (`UDP-PASSIVE :4210`) & Optional `MQTT+UDP` Data Plane (`udp://{client_ip}:{udp_port}`)**:
       - Automatically clocked by the server for 100% passive `supports_local_card: false` receivers (`UDP-PASSIVE`, `:4210`),
         or triggered explicitly when an optional `transport: "mqtt_udp"` client publishes
         `{"action": "start_stream", "item_id": "...", "udp_ip": "...", "udp_port": ...}`.
       - `FfmpegUdpClockStreamer` strips the 16-byte `DMDS` file header (`<4sBBHHHHH`), clocks raw RGB565LE
         frames via a dedicated monotonic thread at the negotiated `video_fps`, and slices each frame into Wi-Fi MTU-safe
         UDP datagrams (`<= 1418` bytes total: **10-byte Little-Endian `<4sHBBH` `DMDF` header** + `<= 1408` bytes RGB565LE = `6` chunks per `128x32` frame).
    4. **`N+1` Background Pipelining, On-Demand Queue & Strict Consume-Once**:
       - Publishing `start_card` immediately marks item `N` consumed in `seen_history.json` (unless `mark_seen: false`
         was set by `FrontendSync` on-demand playback), updates the retained `ready` topic to `{"ready": false}`,
         and starts preparing unseen item `N+1` in the background while preserving item `N`'s stream file on disk
         until the HTTP TCP `DMDS` (`?purge=true`) or UDP `DMDF` session finishes.
  contact:
    name: ArcadeMatrix Community
    url: https://t.me/+DrSdAO8UMUViNmE0
  license:
    name: MIT

servers:
  embeddedMqttBroker:
    url: mqtt://{host}:1883
    protocol: mqtt
    description: Zero-config Embedded MQTT 3.1.1 Broker hosted inside `dmd-media-showcase` (or External Mosquitto).
    variables:
      host:
        default: dmdmediashowcase.local
  udpDmdfStreamer:
    url: udp://{client_ip}:{udp_port}
    protocol: udp
    description: >-
      Unidirectional real-time UDP `DMDF` RGB565LE chunk stream sent from the Showcase server to the UDP socket bound
      by passive Mode 2B ESP32 receivers (`4210`, `UDP-PASSIVE`) or optional `mqtt_udp` clients (`5568 + domain_idx` on ESP32, ephemeral/configured port on RPi).
    variables:
      client_ip:
        default: 192.168.1.50
      udp_port:
        default: "4210"

channels:
  dmd_showcase/server/status:
    servers:
      - embeddedMqttBroker
    description: "Server availability status (`retain=True`) with automatic `LWT` (`online: false`) on ungraceful disconnect."
    subscribe:
      summary: Receive server online/offline status
      bindings:
        mqtt:
          qos: 0
          retain: true
      message:
        $ref: '#/components/messages/ServerStatusMessage'

  dmd_showcase/catalog/{domain}/referential:
    servers:
      - embeddedMqttBroker
    description: Consolidated localized scraper referential (`systems`, `genres`, `decades`, `sources`) for a domain (`retain=True`).
    parameters:
      domain:
        $ref: '#/components/parameters/DomainParam'
    subscribe:
      summary: Receive consolidated domain referential
      bindings:
        mqtt:
          qos: 0
          retain: true
      message:
        $ref: '#/components/messages/CatalogReferentialMessage'

  dmd_showcase/clients/{dmd_id}/status:
    servers:
      - embeddedMqttBroker
    description: 'DMD client presence and `LWT` disconnect notification (`{"online": false}`).'
    parameters:
      dmd_id:
        $ref: '#/components/parameters/DmdIdParam'
    publish:
      summary: Publish DMD client online/offline LWT status
      bindings:
        mqtt:
          qos: 0
          retain: false
      message:
        $ref: '#/components/messages/ClientStatusMessage'

  dmd_showcase/clients/{dmd_id}/hello:
    servers:
      - embeddedMqttBroker
    description: >-
      Retained hardware announcement (`retain=True`) for `server`-managed hybrid (`supports_local_card: true`, Model 2A `MQTT+TCP`)
      or passive (`supports_local_card: false`, Model 2B `UDP-PASSIVE :4210`) ESP32 receivers (`dmd_showcase/clients/{dmdId}/hello`).
      Declares panel geometry (`width`, `height`), preferred transport (`mqtt_tcp` default when `supports_local_card: true`),
      optional LAN UDP target (`udp_ip`, `udp_port`), local Info Card capability (`supports_local_card`), and default `lang`
      while leaving playlists, filters, and presets to `./data/dmd_profiles.json` on the Showcase server.
    parameters:
      dmd_id:
        $ref: '#/components/parameters/DmdIdParam'
    publish:
      summary: Publish server-managed DMD hardware announcement (`retain=True`)
      bindings:
        mqtt:
          qos: 0
          retain: true
      message:
        $ref: '#/components/messages/ClientHelloMessage'

  dmd_showcase/clients/{dmd_id}/config:
    servers:
      - embeddedMqttBroker
    description: >-
      Retained client-driven DMD geometry, transport (`mqtt_tcp` default for paced HTTP TCP `DMDS` `:8890`, or optional `mqtt_udp`),
      LAN IP (`client_ip` / `udp_ip`), optional UDP port, and per-domain filter criteria (`retain=True`).
    parameters:
      dmd_id:
        $ref: '#/components/parameters/DmdIdParam'
    publish:
      summary: Publish DMD client configuration (`retain=True`)
      bindings:
        mqtt:
          qos: 0
          retain: true
      message:
        $ref: '#/components/messages/ClientConfigMessage'

  dmd_showcase/clients/{dmd_id}/{domain}/ready:
    servers:
      - embeddedMqttBroker
    description: >-
      Authoritative retained Consume-Once slot state (`retain=True`). Publishes `{"ready": true, "card": {...}}`
      with a compact collision-free `item_id` (`pkg_<domain>_<12hex>`, `<= 24` chars) when an unseen item and its
      unified `.rgb565.stream` (`DMDS`) are ready on disk, or `{"ready": false}` while warming `N+1`
      so rotating DMD engines can yield their turn immediately without stalling.
    parameters:
      dmd_id:
        $ref: '#/components/parameters/DmdIdParam'
      domain:
        $ref: '#/components/parameters/DomainParam'
    subscribe:
      summary: "Receive prepared showcase card (`ready: true`) or explicit warming state (`ready: false`)"
      bindings:
        mqtt:
          qos: 0
          retain: true
      message:
        $ref: '#/components/messages/SlotReadyMessage'

  dmd_showcase/clients/{dmd_id}/{domain}/events:
    servers:
      - embeddedMqttBroker
    description: >-
      Real-time per-domain lifecycle commands published by the DMD (`start_card` for primary `MQTT+TCP` Consume-Once lock + `N+1` prep,
      plus optional `start_stream` / `stop_stream` for `mqtt_udp` sessions).
      The legacy domain-less topic `dmd_showcase/clients/{dmd_id}/events` is also accepted.
    parameters:
      dmd_id:
        $ref: '#/components/parameters/DmdIdParam'
      domain:
        $ref: '#/components/parameters/DomainParam'
    publish:
      summary: Trigger `start_card` (`MQTT+TCP` Consume-Once lock + `N+1` prep), optional `start_stream` (`mqtt_udp` `DMDF`), or `stop_stream`
      bindings:
        mqtt:
          qos: 0
          retain: false
      message:
        $ref: '#/components/messages/ClientEventMessage'

  dmd_showcase/clients/{dmd_id}/command:
    servers:
      - embeddedMqttBroker
    description: >-
      Server-to-DMD real-time playback control and server-managed card push (`dmd_showcase/clients/{dmdId}/command`).
      Delivers `play_card`, `skip`, `pause`, `resume`, and `stop` directives triggered by the Showcase WebUI,
      On-Demand Priority Queue (`play_now`), `FrontendSync` game launchers, or the server-managed playlist scheduler.
    parameters:
      dmd_id:
        $ref: '#/components/parameters/DmdIdParam'
    subscribe:
      summary: Receive server-to-DMD live control & card push (`play_card`, `skip`, `pause`, `resume`, `stop`)
      bindings:
        mqtt:
          qos: 0
          retain: false
      message:
        $ref: '#/components/messages/ClientCommandMessage'

  dmd_showcase/clients/{dmd_id}/stream_state:
    servers:
      - embeddedMqttBroker
    description: Server-to-DMD stream lifecycle notifications (`stream_started`, `stream_eof`) for UDP `DMDF` sessions.
    parameters:
      dmd_id:
        $ref: '#/components/parameters/DmdIdParam'
    subscribe:
      summary: Receive `stream_started` and `stream_eof` events
      bindings:
        mqtt:
          qos: 0
          retain: false
      message:
        $ref: '#/components/messages/StreamStateMessage'

  udp/dmdf_frame_chunk:
    servers:
      - udpDmdfStreamer
    description: >-
      Real-time binary UDP datagram stream (`DMDF`) carrying MTU-safe RGB565LE framebuffer slices clocked by
      `FfmpegUdpClockStreamer` toward `{udp_ip}:{udp_port}` for Mode 2B passive receivers (`UDP-PASSIVE :4210`,
      `supports_local_card: false`) or optional `mqtt_udp` sessions between `start_stream` and `stream_eof` / `stop_stream`.
    subscribe:
      summary: Receive real-time `DMDF` 10-byte header + RGB565LE pixel chunk datagrams over UDP
      message:
        $ref: '#/components/messages/DmdfUdpDatagram'

components:
  parameters:
    DmdIdParam:
      description: Unique DMD client/engine identifier (e.g. `esp32_passive_128x32`, `esp32_games_128x32`, `rpi_movies_128x32`).
      schema:
        type: string
    DomainParam:
      description: Showcase media domain.
      schema:
        type: string
        enum: [games, movies, series, anime]

  messages:
    ServerStatusMessage:
      name: ServerStatusMessage
      contentType: application/json
      payload:
        type: object
        required: [online, version]
        properties:
          online:
            type: boolean
          version:
            type: string
          mode:
            type: string
            enum: [embedded, external]
          port:
            type: integer

    ClientStatusMessage:
      name: ClientStatusMessage
      contentType: application/json
      payload:
        type: object
        required: [online]
        properties:
          online:
            type: boolean
          dmd_id:
            type: string

    ClientHelloMessage:
      name: ClientHelloMessage
      contentType: application/json
      payload:
        type: object
        required: [width, height]
        properties:
          dmd_id:
            type: string
            example: esp32_passive_128x32
          display_name:
            type: string
            description: Optional human-readable label displayed in the Showcase WebUI.
          config_source:
            type: string
            enum: [server, client]
            default: server
            description: "Declares server-managed profile ownership (`server` loads playlist & filters from `./data/dmd_profiles.json`)."
          supports_local_card:
            type: boolean
            default: false
            description: >-
              `true` (Model 2A Hybrid, `MQTT+TCP` default) if the ESP32 renders Phase 1 Info Cards locally and streams Phase 2 over paced HTTP TCP `DMDS` (`:8890`);
              `false` (Model 2B 100% Passive, `UDP-PASSIVE :4210`) if the server composites the Info Card directly into the RGB565 UDP `DMDF` stream.
          transport:
            type: string
            enum: [mqtt_tcp, mqtt_udp]
            default: mqtt_tcp
            description: >-
              Data-plane streaming transport for hybrid (`supports_local_card: true`) receivers (`mqtt_tcp` default for real-time paced HTTP TCP `DMDS` `:8890`,
              or optional `mqtt_udp` for UDP `DMDF`).
          width:
            type: integer
            example: 128
          height:
            type: integer
            example: 32
          client_ip:
            type: string
            description: Real LAN IPv4 of the DMD receiver (bypasses Docker bridge NAT `172.18.0.1`).
          udp_ip:
            type: string
            description: Target IPv4 for real-time UDP `DMDF` datagrams (Mode 2B `UDP-PASSIVE` or optional `mqtt_udp`).
            example: 192.168.1.60
          udp_port:
            type: integer
            default: 4210
            example: 4210
            description: UDP socket port bound by the receiver (`4210` default for passive Mode 2B ESP32 receivers).
          lang:
            type: string
            default: fr
            example: fr
            description: Fallback ISO content language (`fr`, `en`, `es`, `de`, `it`, `ja`) before server profile override.
          firmware:
            type: string
            description: Optional firmware identifier and version string.

    CatalogReferentialMessage:
      name: CatalogReferentialMessage
      contentType: application/json
      payload:
        type: object
        required: [domain, lang, genres, decades]
        properties:
          domain:
            type: string
            enum: [games, movies, series, anime]
          lang:
            type: string
          sources:
            type: array
            description: Active ordered scraper adapters for this domain (`source_policies`).
            items:
              type: object
              properties:
                id: { type: string }
                label: { type: string }
                display_name: { type: string }
                role: { type: string, enum: [primary, fallback] }
                priority: { type: integer }
                enabled: { type: boolean }
                configured: { type: boolean }
                health: { type: string, enum: [ok, cooldown, unconfigured] }
          systems:
            type: array
            description: "66 canonical arcade, console, handheld, and home-computer systems (when `domain == 'games'`)."
            items:
              type: object
              properties:
                id: { type: string }
                label: { type: string }
                badge: { type: string }
                is_arcade: { type: boolean }
                genres:
                  type: array
                  items: { type: string }
                decades:
                  type: array
                  items: { type: string }
                supported_genres:
                  type: array
                  items: { type: string }
                supported_decades:
                  type: array
                  items: { type: string }
                sources:
                  type: array
                  items: { type: string }
          genres:
            type: array
            items:
              type: object
              properties:
                id: { type: string }
                label: { type: string }
          decades:
            type: array
            items:
              type: object
              properties:
                id: { type: string }
                label: { type: string }

    ClientConfigMessage:
      name: ClientConfigMessage
      contentType: application/json
      payload:
        type: object
        required: [width, height, lang]
        properties:
          dmd_id: { type: string }
          config_source:
            type: string
            enum: [client, server]
            default: client
            description: "`client` when the DMD firmware owns its rotation and domain filters (Model 1)."
          transport:
            type: string
            enum: [mqtt_tcp, mqtt_udp]
            default: mqtt_tcp
            description: >-
              Primary streaming transport (`mqtt_tcp` default: MQTT `:1883` control plane + real-time paced HTTP TCP `DMDS` `:8890`
              `?purge=true&paced=1&drop_late=1`; `mqtt_udp` optional legacy UDP `DMDF`).
          client_ip:
            type: string
            description: Real LAN IPv4 of the DMD client (bypasses Docker bridge NAT `172.18.0.1`).
          udp_ip:
            type: string
            description: Optional explicit target IPv4 for UDP `DMDF` datagrams when `transport == "mqtt_udp"`.
          udp_port:
            type: integer
            description: Optional UDP receiver port bound by the DMD client when `transport == "mqtt_udp"`.
            example: 5568
          width: { type: integer, example: 128 }
          height: { type: integer, example: 32 }
          lang: { type: string, example: fr }
          domains:
            type: object
            additionalProperties:
              type: object
              properties:
                transport:
                  type: string
                  enum: [mqtt_tcp, mqtt_udp]
                  default: mqtt_tcp
                systems:
                  oneOf:
                    - type: array
                      items: { type: string }
                    - type: string
                genres:
                  oneOf:
                    - type: array
                      items: { type: string }
                    - type: string
                decades:
                  oneOf:
                    - type: array
                      items: { type: string }
                    - type: string
                video_type: { type: string, default: any }
                min_rating: { type: number, default: 0.0 }
                text_scroll_speed:
                  type: string
                  description: "'1' (Slow) to '10' (Turbo, 160 px/s) or 'slow'|'normal'|'fast'|'turbo'."
                  example: "8"
                show_poster: { type: boolean, default: true }
                show_synopsis: { type: boolean, default: true }
                jacket_panorama: { type: boolean, default: true }
                marquee_panorama: { type: boolean, default: false }
                snapshot_panorama_count: { type: integer, minimum: 0, maximum: 5, default: 0 }
                show_video: { type: boolean, default: true }
                video_max_duration_s:
                  type: number
                  minimum: 2.0
                  maximum: 120.0
                  default: 8.0
                  description: Maximum trailer clip duration in seconds (hard-clamped to `2..=120s` on both DMD and server).
                video_fps: { type: integer, minimum: 8, maximum: 60, default: 15 }
                video_mode: { type: string, enum: [auto_action, panorama, center_crop], default: auto_action }
                color_boost: { type: string, enum: [auto, pixel_art, anime, cinema], default: auto }

    SlotReadyMessage:
      name: SlotReadyMessage
      contentType: application/json
      payload:
        type: object
        required: [ready, domain]
        properties:
          ready:
            type: boolean
            description: "`true` when an unseen item is ready to play immediately; `false` while preparing in background."
          item_id:
            type: string
            maxLength: 24
            example: pkg_games_a1b2c3d4e5f6
            description: Compact collision-free package identifier (`pkg_<domain>_<12hex>`, `<= 24` chars).
          domain: { type: string }
          card:
            type: object
            properties:
              id: { type: string, example: pkg_games_a1b2c3d4e5f6 }
              item_id: { type: string, maxLength: 24, example: pkg_games_a1b2c3d4e5f6 }
              domain: { type: string }
              title: { type: string }
              year: { type: string }
              badge: { type: string }
              badge_color: { type: string }
              subtitle: { type: string }
              rating: { type: string }
              synopsis: { type: string }
              lang: { type: string }
              source_used:
                type: string
                description: >-
                  Provenance of the resolved media package (single adapter ID such as `igdb`, `screenscraper`,
                  `arcadeitalia`, `libretro_wikidata`, `tmdb_movies`, `jikan`, or `+`-joined composite provenance
                  such as `igdb+arcadeitalia` / `tmdb_movies+itunes_movies` when `aggregation_mode == "enrich_missing"`).
              poster_width: { type: integer }
              poster_height: { type: integer }
              poster_rgb565_b64: { type: string }
              text_scroll_speed: { type: string }
              has_panoramas: { type: boolean }
              has_video: { type: boolean }
              stream_frames: { type: integer }
              stream_fps: { type: integer }
              fps: { type: integer }
              stream_duration_s: { type: number }
              total_stream_duration_s: { type: number }

    ClientEventMessage:
      name: ClientEventMessage
      contentType: application/json
      payload:
        type: object
        required: [item_id]
        properties:
          action:
            type: string
            enum: [start_card, start_stream, stop_stream]
            description: >-
              Primary command field (`event` is accepted as an alias). `MQTT+TCP` clients publish `start_card` to lock Consume-Once
              and trigger background `N+1` preparation before opening paced HTTP TCP `DMDS` (`?purge=true&paced=1&drop_late=1`).
          event:
            type: string
            enum: [start_card, start_stream, stop_stream]
            description: Alias for `action`.
          domain:
            type: string
            enum: [games, movies, series, anime]
          item_id:
            type: string
            maxLength: 24
            example: pkg_games_a1b2c3d4e5f6
          transport:
            type: string
            enum: [mqtt_tcp, mqtt_udp]
            default: mqtt_tcp
          purge:
            type: boolean
            default: true
            description: Whether the consumed stream cache file should be purged once streaming finishes.
          client_ip:
            type: string
            description: Optional real LAN IPv4 of the DMD client for `mqtt_udp` streaming.
          udp_ip:
            type: string
            description: Optional target IPv4 for UDP `DMDF` datagrams (`mqtt_udp`).
          udp_port:
            type: integer
            description: Optional UDP port bound by the DMD client receiver socket (`1024..65535`, `mqtt_udp`).

    ClientCommandMessage:
      name: ClientCommandMessage
      contentType: application/json
      payload:
        type: object
        required: [action]
        properties:
          action:
            type: string
            enum: [play_card, skip, pause, resume, stop]
            description: >-
              Server-to-DMD control directive: `play_card` pushes an immediate Info Card + stream on
              server-managed hybrid receivers (`supports_local_card: true`), while `skip`, `pause`, `resume`,
              and `stop` control active playback in real time.
          dmd_id:
            type: string
          domain:
            type: string
            enum: [games, movies, series, anime]
          item_id:
            type: string
            example: pkg_games_a1b2c3d4e5f6
          mode:
            type: string
            enum: [enqueue_next, play_now]
          mark_seen:
            type: boolean
            default: true
            description: "`false` when triggered by `FrontendSync` (Batocera / RetroBat / LaunchBox / Playnite) so attract-mode `seen_history.json` is preserved."
          card:
            type: object
            description: Full prepared showcase card object when `action == "play_card"`.

    StreamStateMessage:
      name: StreamStateMessage
      contentType: application/json
      payload:
        type: object
        required: [event, item_id, domain]
        properties:
          event:
            type: string
            enum: [stream_started, stream_eof]
          item_id:
            type: string
            example: pkg_games_a1b2c3d4e5f6
          domain:
            type: string

    DmdfUdpDatagram:
      name: DmdfUdpDatagram
      title: Binary DMDF UDP Frame Chunk Datagram
      contentType: application/octet-stream
      summary: 10-byte Little-Endian `<4sHBBH` header + `<= 1408`-byte RGB565LE framebuffer slice (`<= 1418` bytes/UDP packet).
      description: |
        > **Transport Note**: Models 1 & 2A (`supports_local_card: true`) use **`MQTT+TCP` (`mqtt_tcp`) by default** — streaming
        > real-time server-paced `DMDS` frames (`<4sBBHHHHH` 16-byte header + `X-DMD-Paced: 1`) over HTTP TCP `:8890`
        > (`GET /api/v1/{domain}/stream/{item_id}.rgb565.stream?purge=true&paced=1&drop_late=1`, documented in `/openapi.json`).
        > The UDP `DMDF` datagram format below powers **Model 2B Passive Receivers (`UDP-PASSIVE :4210`, `supports_local_card: false`)**
        > and optional `mqtt_udp` sessions.

        Each video or panorama frame (`width * height * 2` bytes of Little-Endian RGB565 pixels, e.g. `8192` bytes
        for `128x32` = `6` chunks of `<= 1408` bytes fitting ESP32 `UDP_RECVMBOX_SIZE=6` & `kRxBaWin=6`) is split into MTU-safe UDP datagrams packed in Little-Endian
        (`struct.pack("<4sHBBH", b"DMDF", frame_seq, chunk_idx, total_chunks, byte_offset) + payload`):

        | Byte Offset | C / Struct Type | Field | Constraints & Semantics |
        | :--- | :--- | :--- | :--- |
        | `0..3` | `char[4]` (`4s`) | `magic` | ASCII `"DMDF"` (`0x44 0x4D 0x44 0x46`) |
        | `4..5` | `uint16le` (`H`) | `frame_seq` | Wrapping monotonic frame counter (`0..65535`) |
        | `6` | `uint8` (`B`) | `chunk_idx` | Zero-based chunk index within `frame_seq` (`0 .. total_chunks - 1`) |
        | `7` | `uint8` (`B`) | `total_chunks` | Total chunks forming the complete frame (`1..64`) |
        | `8..9` | `uint16le` (`H`) | `byte_offset` | Destination byte offset (`chunk_idx * 1408`) in RGB565LE framebuffer |
        | `10..N` | `uint8[<=1408]` | `payload` | Raw Little-Endian RGB565 pixel bytes (`1..1408` bytes) |

        **Reassembly & Watchdog Contract (Mode 2B Passive ESP32 & Optional `mqtt_udp`)**:
        - Copy `payload` directly into `framebuffer_bytes[byte_offset .. byte_offset + len(payload)]` if bounds-valid
          and `total_chunks <= 64`.
        - Set bit `(1 << chunk_idx)` in a 64-bit `chunk_mask`; commit the frame when `chunk_mask == (1 << total_chunks) - 1`
          (or flush partial non-zero `chunk_mask` if `frame_seq` advances on minor Wi-Fi packet loss).
        - On optional `mqtt_udp` clients, combine MQTT `stream_eof` with a local `2,500 ms` UDP inactivity watchdog
          (`millis() - lastUdpPacketMs > 2500`) and fall back to paced HTTP TCP `DMDS`
          (`/api/v1/{domain}/stream/{item_id}.rgb565.stream?purge=true&paced=1&drop_late=1`) if VM NAT blocks UDP.
      payload:
        type: string
        format: binary
        minLength: 12
        maxLength: 1418
        x-binary-header-format: "<4sHBBH"
        x-binary-header-bytes: 10
        x-max-payload-bytes: 1408
        x-header-fields:
          magic:
            offset: 0
            size: 4
            type: ascii
            const: DMDF
          frame_seq:
            offset: 4
            size: 2
            type: uint16le
          chunk_idx:
            offset: 6
            size: 1
            type: uint8
          total_chunks:
            offset: 7
            size: 1
            type: uint8
            minimum: 1
            maximum: 64
          byte_offset:
            offset: 8
            size: 2
            type: uint16le
          payload:
            offset: 10
            maxSize: 1408
            type: rgb565le
