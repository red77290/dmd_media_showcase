asyncapi: 2.6.0
info:
  title: DMD Media Showcase Server — MQTT 3.1.1 Control Plane, Credit-Acked WebSocket DMDZ, HTTP DMDS & Passive UDP DMDF Streaming Protocol
  version: 1.1.4
  description: |
    Asynchronous Control & Real-Time Binary Frame Streaming specification for **DMD Media Showcase Server**,
    powering **ArcadeMatrix (ESP32 / ESP32-S3)**, **Server-Managed Hybrid & Passive ESP32 Receivers**, and **ArcadeMatrix_RPi** HUB75 LED panels.

    ### Protocol Architecture
    1. **MQTT 3.1.1 Control Plane (`:1883`)**:
       - Uses `retain=True` for server availability (`dmd_showcase/server/status`), consolidated scraper
         referentials (`dmd_showcase/catalog/{domain}/referential`), client-driven DMD configurations
         (`dmd_showcase/clients/{dmd_id}/config`), server-managed hybrid/passive hardware announcements
         (`dmd_showcase/clients/{dmd_id}/hello`, persisted against `./data/dmd_profiles.json`), and per-domain
         prepared Consume-Once slots (`dmd_showcase/clients/{dmd_id}/{domain}/ready`) carrying compact
         collision-free `item_id` values (`pkg_<domain>_<12hex>`, `<= 24` chars).
       - Uses `dmd_showcase/clients/{dmd_id}/command` for real-time server-to-DMD live control and on-demand
         card push (`action: "play_card" | "skip" | "pause" | "resume" | "stop"`).
       - Uses `LWT` (Last Will and Testament) on both server and DMD clients for instant disconnect cleanup
         while preserving background `N+1` media transcoding tasks across rotation slot switches.
    2. **Primary Data Plane (`MQTT+TCP` Default — Models 1 & 2A, `supports_local_card: true`)**:
       - **3-Tier Adaptive Streaming (`profile=sram | psram | psram_hd`)**:
         - **`profile=sram` (`esp32dev`, 0 KB PSRAM)**: Claims the retained `ready` slot via `{"action": "start_card", "item_id": "..."}`,
           fetches the binary RGB565 mini-jacket over HTTP (`/api/v1/{domain}/poster/{item_id}.rgb565`) during Card intro, and upgrades
           Phase 2 to **`WS /api/v1/{domain}/ws/{item_id}.dmdz?purge=true&client_id={dmd_id}&v=2&credits=4&chunk=1360&profile=sram`**
           (`ws_per_message_deflate=False`). Serves `.dmdz2.sram.stream` combining motion-compensated temporal H.264 denoise with hybrid
           True-RGB565 (`<= 1,400 B`) and `FRAME_PAL8` (`0x05`, `1..128` RGB565 scene colors + optional 2D scroll + `PAL_INDEX`/`PAL_SKIP`/`PAL_RUN`/`PAL_LONG_SKIP`),
           bounding **every frame `<= 1,400 B`**, coalescing the `16 B` `DMDZ` header with Frame `0`, and applying `2 ms` inter-chunk pacing (`20–24 FPS`).
         - **`profile=psram` (`ESP32-S3 <= 128x64`, Octal PSRAM)**: Preloads unpaced True-RGB565 `.dmdz2.stream` up to `1.5 MB` directly
           into PSRAM during the Card intro via **`GET /api/v1/{domain}/stream/{item_id}.rgb565.stream?purge=false&paced=0&codec=dmdz2&profile=psram`**
           (`0` Wi-Fi traffic during playback, `25–30 FPS`), with automatic live fallback to `WS ?v=2&credits=12&chunk=1400&profile=psram` (`256 KB` PSRAM ring).
         - **`profile=psram_hd` (`ESP32-S3 256x64+`, Octal PSRAM)**: Preloads up to `3.5 MB` of unpaced True-RGB565 `.dmdz2.stream` into PSRAM
           (`?purge=false&paced=0&codec=dmdz2&profile=psram_hd`) or streams live via `WS ?v=2&credits=16&chunk=1400&profile=psram_hd` (`768 KB` PSRAM ring, `24–30 FPS` HD).
         - **`ArcadeMatrix_RPi` (Raspberry Pi / Linux)**: Preloads unpaced raw `DMDS` over `GET /api/v1/{domain}/stream/{item_id}.rgb565.stream?purge=false|true` (no `codec`).
       - **Why Credit-Acked WebSocket `DMDZ` (`v2` `dmdz2` / `v1` `dmdz1`)**:
         - `101 Switching Protocols` disables HTTP proxy/NAT response buffering (`gvproxy` / Rancher Desktop / Docker Desktop / Nginx).
         - Binary WebSocket frames (`256..1,400` bytes, e.g. `1,360 B` full Wi-Fi MSS) are gated by an explicit `credits` sliding window
           (`1..16` credits; coalesced `'A'`/`0x41` client ACKs), eliminating LwIP `pcb->ooseq` heap exhaustion while Core 1 drives 8-bit CIE-1931 HUB75 DMA.
         - If a reverse proxy blocks WebSocket upgrades, clients fall back transparently to paced HTTP TCP (`?purge=true&paced=1&codec=dmdz2&profile=...`).
    3. **Passive Mode 2B (`UDP-PASSIVE :4210`) & Optional `MQTT+UDP` Data Plane (`udp://{client_ip}:{udp_port}`)**:
       - Automatically clocked by the server for 100% passive `supports_local_card: false` receivers (`UDP-PASSIVE`, `:4210`),
         or triggered explicitly when an optional `transport: "mqtt_udp"` client publishes
         `{"action": "start_stream", "item_id": "...", "udp_ip": "...", "udp_port": ...}`.
       - `FfmpegUdpClockStreamer` strips the 16-byte `DMDS` file header (`<4sBBHHHHH`), clocks raw RGB565LE
         frames via a dedicated monotonic thread at the negotiated `video_fps`, and slices each frame into Wi-Fi MTU-safe
         UDP datagrams (`<= 1418` bytes total: **10-byte Little-Endian `<4sHBBH` `DMDF` header** + `<= 1408` bytes RGB565LE = `6` chunks per `128x32` frame).
    4. **`N+1` Background Pipelining, On-Demand Queue & Strict Consume-Once**:
       - Publishing `start_card` immediately marks item `N` consumed in `seen_history.json` (unless `mark_seen: false`
         was set by `FrontendSync` on-demand playback), updates the retained `ready` topic to `{"ready": false}`,
         and starts preparing unseen item `N+1` in the background while preserving item `N`'s `.rgb565.stream` + `.dmdz.stream`
         files on disk until the WebSocket `DMDZ`, HTTP `DMDS`, or UDP `DMDF` session finishes (`purge=true`).
  contact:
    name: ArcadeMatrix Community
    url: https://t.me/+DrSdAO8UMUViNmE0
  license:
    name: MIT

servers:
  embeddedMqttBroker:
    url: mqtt://{host}:1883
    protocol: mqtt
    description: Zero-config Embedded MQTT 3.1.1 Broker hosted inside `dmd-media-showcase` (or External Mosquitto).
    variables:
      host:
        default: dmdmediashowcase.local
  wsDmdzStreamer:
    url: ws://{host}:8890
    protocol: ws
    description: >-
      ZeDMD-style credit-acknowledged `DMDZ` (`v1`/`v2`) WebSocket endpoint (`ws_per_message_deflate=False`) serving
      adaptive `profile=sram|psram|psram_hd` binary sub-packets (`256..1,400 B`, coalesced `16 B` header + Frame `0`)
      gated by a `1..16`-credit sliding window for `ESP32` (`esp32dev` 0 PSRAM) and `ESP32-S3` HUB75 matrices.
    variables:
      host:
        default: dmdmediashowcase.local
  udpDmdfStreamer:
    url: udp://{client_ip}:{udp_port}
    protocol: udp
    description: >-
      Unidirectional real-time UDP `DMDF` RGB565LE chunk stream sent from the Showcase server to the UDP socket bound
      by passive Mode 2B ESP32 receivers (`4210`, `UDP-PASSIVE`) or optional `mqtt_udp` clients (`5568 + domain_idx` on ESP32, ephemeral/configured port on RPi).
    variables:
      client_ip:
        default: 192.168.1.50
      udp_port:
        default: "4210"

channels:
  dmd_showcase/server/status:
    servers:
      - embeddedMqttBroker
    description: "Server availability status (`retain=True`) with automatic `LWT` (`online: false`) on ungraceful disconnect."
    subscribe:
      summary: Receive server online/offline status
      bindings:
        mqtt:
          qos: 0
          retain: true
      message:
        $ref: '#/components/messages/ServerStatusMessage'

  dmd_showcase/catalog/{domain}/referential:
    servers:
      - embeddedMqttBroker
    description: Consolidated localized scraper referential (`systems`, `genres`, `decades`, `sources`) for a domain (`retain=True`).
    parameters:
      domain:
        $ref: '#/components/parameters/DomainParam'
    subscribe:
      summary: Receive consolidated domain referential
      bindings:
        mqtt:
          qos: 0
          retain: true
      message:
        $ref: '#/components/messages/CatalogReferentialMessage'

  dmd_showcase/clients/{dmd_id}/status:
    servers:
      - embeddedMqttBroker
    description: 'DMD client presence and `LWT` disconnect notification (`{"online": false}`).'
    parameters:
      dmd_id:
        $ref: '#/components/parameters/DmdIdParam'
    publish:
      summary: Publish DMD client online/offline LWT status
      bindings:
        mqtt:
          qos: 0
          retain: false
      message:
        $ref: '#/components/messages/ClientStatusMessage'

  dmd_showcase/clients/{dmd_id}/hello:
    servers:
      - embeddedMqttBroker
    description: >-
      Retained hardware announcement (`retain=True`) for `server`-managed hybrid (`supports_local_card: true`, Model 2A `MQTT+TCP`)
      or passive (`supports_local_card: false`, Model 2B `UDP-PASSIVE :4210`) ESP32 receivers (`dmd_showcase/clients/{dmdId}/hello`).
      Declares panel geometry (`width`, `height`), preferred transport (`mqtt_tcp` default when `supports_local_card: true`),
      optional LAN UDP target (`udp_ip`, `udp_port`), local Info Card capability (`supports_local_card`), and default `lang`
      while leaving playlists, filters, and presets to `./data/dmd_profiles.json` on the Showcase server.
    parameters:
      dmd_id:
        $ref: '#/components/parameters/DmdIdParam'
    publish:
      summary: Publish server-managed DMD hardware announcement (`retain=True`)
      bindings:
        mqtt:
          qos: 0
          retain: true
      message:
        $ref: '#/components/messages/ClientHelloMessage'

  dmd_showcase/clients/{dmd_id}/config:
    servers:
      - embeddedMqttBroker
    description: >-
      Retained client-driven DMD geometry, transport (`mqtt_tcp` default for credit-acked WebSocket `DMDZ` / HTTP `DMDS` `:8890`, or optional `mqtt_udp`),
      LAN IP (`client_ip` / `udp_ip`), optional UDP port, and per-domain filter criteria (`retain=True`).
    parameters:
      dmd_id:
        $ref: '#/components/parameters/DmdIdParam'
    publish:
      summary: Publish DMD client configuration (`retain=True`)
      bindings:
        mqtt:
          qos: 0
          retain: true
      message:
        $ref: '#/components/messages/ClientConfigMessage'

  dmd_showcase/clients/{dmd_id}/{domain}/ready:
    servers:
      - embeddedMqttBroker
    description: >-
      Authoritative retained Consume-Once slot state (`retain=True`). Publishes `{"ready": true, "card": {...}}`
      with a compact collision-free `item_id` (`pkg_<domain>_<12hex>`, `<= 24` chars) when an unseen item and its
      unified `.rgb565.stream` (`DMDS`) are ready on disk, or `{"ready": false}` while warming `N+1`
      so rotating DMD engines can yield their turn immediately without stalling.
    parameters:
      dmd_id:
        $ref: '#/components/parameters/DmdIdParam'
      domain:
        $ref: '#/components/parameters/DomainParam'
    subscribe:
      summary: "Receive prepared showcase card (`ready: true`) or explicit warming state (`ready: false`)"
      bindings:
        mqtt:
          qos: 0
          retain: true
      message:
        $ref: '#/components/messages/SlotReadyMessage'

  dmd_showcase/clients/{dmd_id}/{domain}/events:
    servers:
      - embeddedMqttBroker
    description: >-
      Real-time per-domain lifecycle commands published by the DMD (`start_card` for primary `MQTT+TCP` Consume-Once lock + `N+1` prep,
      plus optional `start_stream` / `stop_stream` for `mqtt_udp` sessions).
      The legacy domain-less topic `dmd_showcase/clients/{dmd_id}/events` is also accepted.
    parameters:
      dmd_id:
        $ref: '#/components/parameters/DmdIdParam'
      domain:
        $ref: '#/components/parameters/DomainParam'
    publish:
      summary: Trigger `start_card` (`MQTT+TCP` Consume-Once lock + `N+1` prep), optional `start_stream` (`mqtt_udp` `DMDF`), or `stop_stream`
      bindings:
        mqtt:
          qos: 0
          retain: false
      message:
        $ref: '#/components/messages/ClientEventMessage'

  dmd_showcase/clients/{dmd_id}/command:
    servers:
      - embeddedMqttBroker
    description: >-
      Server-to-DMD real-time playback control and server-managed card push (`dmd_showcase/clients/{dmdId}/command`).
      Delivers `play_card`, `skip`, `pause`, `resume`, and `stop` directives triggered by the Showcase WebUI,
      On-Demand Priority Queue (`play_now`), `FrontendSync` game launchers, or the server-managed playlist scheduler.
    parameters:
      dmd_id:
        $ref: '#/components/parameters/DmdIdParam'
    subscribe:
      summary: Receive server-to-DMD live control & card push (`play_card`, `skip`, `pause`, `resume`, `stop`)
      bindings:
        mqtt:
          qos: 0
          retain: false
      message:
        $ref: '#/components/messages/ClientCommandMessage'

  dmd_showcase/clients/{dmd_id}/stream_state:
    servers:
      - embeddedMqttBroker
    description: Server-to-DMD stream lifecycle notifications (`stream_started`, `stream_eof`) for UDP `DMDF` sessions.
    parameters:
      dmd_id:
        $ref: '#/components/parameters/DmdIdParam'
    subscribe:
      summary: Receive `stream_started` and `stream_eof` events
      bindings:
        mqtt:
          qos: 0
          retain: false
      message:
        $ref: '#/components/messages/StreamStateMessage'

  /api/v1/{domain}/ws/{item_id}.dmdz:
    servers:
      - wsDmdzStreamer
    description: >-
      ZeDMD-style credit-acknowledged `DMDZ` (`v1`/`v2`) WebSocket stream (`ws_per_message_deflate=False`) for
      `ESP32` (`esp32dev` 0 PSRAM, `profile=sram`) and `ESP32-S3` (`profile=psram|psram_hd`) HUB75 clients.
      After `101 Switching Protocols`, the server coalesces the 16-byte `<4sBBHHHHH` `"DMDZ"` header with Frame `0`
      into the initial binary sub-packet window (`chunk=256..1400`, default `1024`, `1360` full MSS on `profile=sram`),
      followed by `<H` `payload_len` + `DMDZ` frame ops (`profile=sram` serves `.dmdz2.sram.stream` with `FRAME_PAL8` `0x05`
      capped `<= 1,400 B/frame` and `2 ms` inter-chunk pacing; `profile=psram|psram_hd` serves lossless `.dmdz2.stream`).
      The client returns `'A'` (`0x41`) credit ACKs (`1` credit per byte) after draining chunks into its SPSC ring buffer.
    parameters:
      domain:
        $ref: '#/components/parameters/DomainParam'
      item_id:
        $ref: '#/components/parameters/ItemIdParam'
    bindings:
      ws:
        method: GET
        query:
          type: object
          properties:
            purge:
              type: boolean
              default: true
              description: Purge the consumed `.rgb565.stream` and `.dmdz*.stream` files from disk upon completion.
            client_id:
              type: string
              description: Logical DMD client identifier for live telemetry (`e.g. esp32_games_128x32`).
            v:
              type: integer
              enum: [1, 2]
              default: 1
              description: "`DMDZ` wire protocol version (`2` recommended for `dmdz2` + `FRAME_SCROLL_2D` + `FRAME_PAL8`)."
            credits:
              type: integer
              minimum: 1
              maximum: 16
              default: 2
              description: "Initial in-flight WebSocket sub-packet credit window (`4` for `esp32dev` `profile=sram`; `12..16` for `ESP32-S3` PSRAM)."
            chunk:
              type: integer
              minimum: 256
              maximum: 1400
              default: 1024
              description: "Maximum binary payload bytes per WebSocket message (`1360` for `profile=sram`, `1400` for `psram`/`psram_hd`)."
            profile:
              type: string
              enum: ["", sram, psram, psram_hd]
              default: ""
              description: "Adaptive hardware stream tier (`sram` selects `.dmdz2.sram.stream` `<= 1,400 B/frame` + `2 ms` inter-chunk pacing; `psram`/`psram_hd` select `.dmdz2.stream`)."
            api_key:
              type: string
              description: Optional `SHOWCASE_API_KEY` token when API authentication is enabled.
    subscribe:
      summary: Receive coalesced 16-byte `DMDZ` header + Frame `0` followed by `<= chunk` `DMDZ` (`v1`/`v2`) frame sub-packets
      message:
        oneOf:
          - $ref: '#/components/messages/DmdzWsHeaderMessage'
          - $ref: '#/components/messages/DmdzWsFrameSubpacketMessage'
    publish:
      summary: Send 1-byte `'A'` (`0x41`) credit ACK per received binary WebSocket message (coalesced multi-byte `'AA...'` supported)
      message:
        $ref: '#/components/messages/DmdzWsCreditAckMessage'

  udp/dmdf_frame_chunk:
    servers:
      - udpDmdfStreamer
    description: >-
      Real-time binary UDP datagram stream (`DMDF`) carrying MTU-safe RGB565LE framebuffer slices clocked by
      `FfmpegUdpClockStreamer` toward `{udp_ip}:{udp_port}` for Mode 2B passive receivers (`UDP-PASSIVE :4210`,
      `supports_local_card: false`) or optional `mqtt_udp` sessions between `start_stream` and `stream_eof` / `stop_stream`.
    subscribe:
      summary: Receive real-time `DMDF` 10-byte header + RGB565LE pixel chunk datagrams over UDP
      message:
        $ref: '#/components/messages/DmdfUdpDatagram'

components:
  parameters:
    DmdIdParam:
      description: Unique DMD client/engine identifier (e.g. `esp32_passive_128x32`, `esp32_games_128x32`, `rpi_movies_128x32`).
      schema:
        type: string
    DomainParam:
      description: Showcase media domain.
      schema:
        type: string
        enum: [games, movies, series, anime]
    ItemIdParam:
      description: Compact collision-free Consume-Once package identifier (`pkg_<domain>_<12hex>`, `<= 24` chars).
      schema:
        type: string
        maxLength: 128

  messages:
    ServerStatusMessage:
      name: ServerStatusMessage
      contentType: application/json
      payload:
        type: object
        required: [online, version]
        properties:
          online:
            type: boolean
          version:
            type: string
          mode:
            type: string
            enum: [embedded, external]
          port:
            type: integer

    ClientStatusMessage:
      name: ClientStatusMessage
      contentType: application/json
      payload:
        type: object
        required: [online]
        properties:
          online:
            type: boolean
          dmd_id:
            type: string

    ClientHelloMessage:
      name: ClientHelloMessage
      contentType: application/json
      payload:
        type: object
        required: [width, height]
        properties:
          dmd_id:
            type: string
            example: esp32_passive_128x32
          display_name:
            type: string
            description: Optional human-readable label displayed in the Showcase WebUI.
          config_source:
            type: string
            enum: [server, client]
            default: server
            description: "Declares server-managed profile ownership (`server` loads playlist & filters from `./data/dmd_profiles.json`)."
          supports_local_card:
            type: boolean
            default: false
            description: >-
              `true` (Model 2A Hybrid, `MQTT+TCP` default) if the ESP32 renders Phase 1 Info Cards locally and streams Phase 2 over credit-acked WebSocket `DMDZ` (`/api/v1/{domain}/ws/{item_id}.dmdz`, with HTTP `?paced=1&codec=dmdz1` fallback);
              `false` (Model 2B 100% Passive, `UDP-PASSIVE :4210`) if the server composites the Info Card directly into the RGB565 UDP `DMDF` stream.
          transport:
            type: string
            enum: [mqtt_tcp, mqtt_udp]
            default: mqtt_tcp
            description: >-
              Data-plane streaming transport for hybrid (`supports_local_card: true`) receivers (`mqtt_tcp` default for credit-acked WebSocket `DMDZ` / HTTP `DMDS` `:8890`,
              or optional `mqtt_udp` for UDP `DMDF`).
          width:
            type: integer
            example: 128
          height:
            type: integer
            example: 32
          client_ip:
            type: string
            description: Real LAN IPv4 of the DMD receiver (bypasses Docker bridge NAT `172.18.0.1`).
          udp_ip:
            type: string
            description: Target IPv4 for real-time UDP `DMDF` datagrams (Mode 2B `UDP-PASSIVE` or optional `mqtt_udp`).
            example: 192.168.1.60
          udp_port:
            type: integer
            default: 4210
            example: 4210
            description: UDP socket port bound by the receiver (`4210` default for passive Mode 2B ESP32 receivers).
          lang:
            type: string
            default: fr
            example: fr
            description: Fallback ISO content language (`fr`, `en`, `es`, `de`, `it`, `ja`) before server profile override.
          firmware:
            type: string
            description: Optional firmware identifier and version string.

    CatalogReferentialMessage:
      name: CatalogReferentialMessage
      contentType: application/json
      payload:
        type: object
        required: [domain, lang, genres, decades]
        properties:
          domain:
            type: string
            enum: [games, movies, series, anime]
          lang:
            type: string
          sources:
            type: array
            description: Active ordered scraper adapters for this domain (`source_policies`).
            items:
              type: object
              properties:
                id: { type: string }
                label: { type: string }
                display_name: { type: string }
                role: { type: string, enum: [primary, fallback] }
                priority: { type: integer }
                enabled: { type: boolean }
                configured: { type: boolean }
                health: { type: string, enum: [ok, cooldown, unconfigured] }
          systems:
            type: array
            description: "66 canonical arcade, console, handheld, and home-computer systems (when `domain == 'games'`)."
            items:
              type: object
              properties:
                id: { type: string }
                label: { type: string }
                badge: { type: string }
                is_arcade: { type: boolean }
                genres:
                  type: array
                  items: { type: string }
                decades:
                  type: array
                  items: { type: string }
                supported_genres:
                  type: array
                  items: { type: string }
                supported_decades:
                  type: array
                  items: { type: string }
                sources:
                  type: array
                  items: { type: string }
          genres:
            type: array
            items:
              type: object
              properties:
                id: { type: string }
                label: { type: string }
          decades:
            type: array
            items:
              type: object
              properties:
                id: { type: string }
                label: { type: string }

    ClientConfigMessage:
      name: ClientConfigMessage
      contentType: application/json
      payload:
        type: object
        required: [width, height, lang]
        properties:
          dmd_id: { type: string }
          config_source:
            type: string
            enum: [client, server]
            default: client
            description: "`client` when the DMD firmware owns its rotation and domain filters (Model 1)."
          transport:
            type: string
            enum: [mqtt_tcp, mqtt_udp]
            default: mqtt_tcp
            description: >-
              Primary streaming transport (`mqtt_tcp` default: MQTT `:1883` control plane + credit-acked WebSocket `DMDZ` `/api/v1/{domain}/ws/{item_id}.dmdz`
              on ESP32/ESP32-S3, HTTP `?paced=1&codec=dmdz1` fallback, or unpaced HTTP `DMDS` preload on `ArcadeMatrix_RPi`; `mqtt_udp` optional legacy UDP `DMDF`).
          client_ip:
            type: string
            description: Real LAN IPv4 of the DMD client (bypasses Docker bridge NAT `172.18.0.1`).
          udp_ip:
            type: string
            description: Optional explicit target IPv4 for UDP `DMDF` datagrams when `transport == "mqtt_udp"`.
          udp_port:
            type: integer
            description: Optional UDP receiver port bound by the DMD client when `transport == "mqtt_udp"`.
            example: 5568
          width: { type: integer, example: 128 }
          height: { type: integer, example: 32 }
          lang: { type: string, example: fr }
          domains:
            type: object
            additionalProperties:
              type: object
              properties:
                transport:
                  type: string
                  enum: [mqtt_tcp, mqtt_udp]
                  default: mqtt_tcp
                systems:
                  oneOf:
                    - type: array
                      items: { type: string }
                    - type: string
                genres:
                  oneOf:
                    - type: array
                      items: { type: string }
                    - type: string
                decades:
                  oneOf:
                    - type: array
                      items: { type: string }
                    - type: string
                video_type: { type: string, default: any }
                min_rating: { type: number, default: 0.0 }
                text_scroll_speed:
                  type: string
                  description: "'1' (Slow) to '10' (Turbo, 160 px/s) or 'slow'|'normal'|'fast'|'turbo'."
                  example: "8"
                show_poster: { type: boolean, default: true }
                show_synopsis: { type: boolean, default: true }
                jacket_panorama: { type: boolean, default: true }
                marquee_panorama: { type: boolean, default: false }
                snapshot_panorama_count: { type: integer, minimum: 0, maximum: 5, default: 0 }
                show_video: { type: boolean, default: true }
                video_max_duration_s:
                  type: number
                  minimum: 2.0
                  maximum: 120.0
                  default: 8.0
                  description: Maximum trailer clip duration in seconds (hard-clamped to `2..=120s` on both DMD and server).
                video_fps: { type: integer, minimum: 8, maximum: 60, default: 15 }
                video_mode: { type: string, enum: [auto_action, panorama, center_crop], default: auto_action }
                color_boost: { type: string, enum: [auto, pixel_art, anime, cinema], default: auto }

    SlotReadyMessage:
      name: SlotReadyMessage
      contentType: application/json
      payload:
        type: object
        required: [ready, domain]
        properties:
          ready:
            type: boolean
            description: "`true` when an unseen item is ready to play immediately; `false` while preparing in background."
          item_id:
            type: string
            maxLength: 24
            example: pkg_games_a1b2c3d4e5f6
            description: Compact collision-free package identifier (`pkg_<domain>_<12hex>`, `<= 24` chars).
          domain: { type: string }
          card:
            type: object
            properties:
              id: { type: string, example: pkg_games_a1b2c3d4e5f6 }
              item_id: { type: string, maxLength: 24, example: pkg_games_a1b2c3d4e5f6 }
              domain: { type: string }
              title: { type: string }
              year: { type: string }
              badge: { type: string }
              badge_color: { type: string }
              subtitle: { type: string }
              rating: { type: string }
              synopsis: { type: string }
              lang: { type: string }
              source_used:
                type: string
                description: >-
                  Provenance of the resolved media package (single adapter ID such as `igdb`, `screenscraper`,
                  `arcadeitalia`, `libretro_wikidata`, `tmdb_movies`, `jikan`, or `+`-joined composite provenance
                  such as `igdb+arcadeitalia` / `tmdb_movies+itunes_movies` when `aggregation_mode == "enrich_missing"`).
              poster_width: { type: integer }
              poster_height: { type: integer }
              poster_rgb565_b64: { type: string }
              text_scroll_speed: { type: string }
              has_panoramas: { type: boolean }
              has_video: { type: boolean }
              stream_frames: { type: integer }
              stream_fps: { type: integer }
              fps: { type: integer }
              stream_duration_s: { type: number }
              total_stream_duration_s: { type: number }

    ClientEventMessage:
      name: ClientEventMessage
      contentType: application/json
      payload:
        type: object
        required: [item_id]
        properties:
          action:
            type: string
            enum: [start_card, start_stream, stop_stream]
            description: >-
              Primary command field (`event` is accepted as an alias). `MQTT+TCP` clients publish `start_card` to lock Consume-Once
              and trigger background `N+1` preparation before opening credit-acked lossless WebSocket `DMDZ`
              (`WS /api/v1/{domain}/ws/{item_id}.dmdz?purge=true&client_id=...`), paced HTTP fallback (`?purge=true&paced=1&codec=dmdz1`),
              or unpaced HTTP `DMDS` preload (`ArcadeMatrix_RPi`).
          event:
            type: string
            enum: [start_card, start_stream, stop_stream]
            description: Alias for `action`.
          domain:
            type: string
            enum: [games, movies, series, anime]
          item_id:
            type: string
            maxLength: 24
            example: pkg_games_a1b2c3d4e5f6
          transport:
            type: string
            enum: [mqtt_tcp, mqtt_udp]
            default: mqtt_tcp
          purge:
            type: boolean
            default: true
            description: Whether the consumed stream cache file should be purged once streaming finishes.
          client_ip:
            type: string
            description: Optional real LAN IPv4 of the DMD client for `mqtt_udp` streaming.
          udp_ip:
            type: string
            description: Optional target IPv4 for UDP `DMDF` datagrams (`mqtt_udp`).
          udp_port:
            type: integer
            description: Optional UDP port bound by the DMD client receiver socket (`1024..65535`, `mqtt_udp`).

    ClientCommandMessage:
      name: ClientCommandMessage
      contentType: application/json
      payload:
        type: object
        required: [action]
        properties:
          action:
            type: string
            enum: [play_card, skip, pause, resume, stop]
            description: >-
              Server-to-DMD control directive: `play_card` pushes an immediate Info Card + stream on
              server-managed hybrid receivers (`supports_local_card: true`), while `skip`, `pause`, `resume`,
              and `stop` control active playback in real time.
          dmd_id:
            type: string
          domain:
            type: string
            enum: [games, movies, series, anime]
          item_id:
            type: string
            example: pkg_games_a1b2c3d4e5f6
          mode:
            type: string
            enum: [enqueue_next, play_now]
          mark_seen:
            type: boolean
            default: true
            description: "`false` when triggered by `FrontendSync` (Batocera / RetroBat / LaunchBox / Playnite) so attract-mode `seen_history.json` is preserved."
          card:
            type: object
            description: Full prepared showcase card object when `action == "play_card"`.

    StreamStateMessage:
      name: StreamStateMessage
      contentType: application/json
      payload:
        type: object
        required: [event, item_id, domain]
        properties:
          event:
            type: string
            enum: [stream_started, stream_eof]
          item_id:
            type: string
            example: pkg_games_a1b2c3d4e5f6
          domain:
            type: string

    DmdzWsHeaderMessage:
      name: DmdzWsHeaderMessage
      title: Binary DMDZ (`v1` / `v2`) Stream Header (16 Bytes, Coalesced with Frame `0`)
      contentType: application/octet-stream
      summary: 16-byte Little-Endian `<4sBBHHHHH` `"DMDZ"` container header coalesced at the head of Frame `0` (or standalone when `total_frames == 0`).
      description: |
        Prefixed at byte offset `0..15` of the initial binary WebSocket message alongside Frame `0` after `101 Switching Protocols`
        on `WS /api/v1/{domain}/ws/{item_id}.dmdz`, saving a full round-trip credit ACK before first-pixel display:

        | Byte Offset | C / Struct Type | Field | Constraints & Semantics |
        | :--- | :--- | :--- | :--- |
        | `0..3` | `char[4]` (`4s`) | `magic` | ASCII `"DMDZ"` (`0x44 0x4D 0x44 0x5A`) |
        | `4` | `uint8` (`B`) | `version` | `DMDZ` wire format version (`1` = `dmdz1`, `2` = `dmdz2`) |
        | `5` | `uint8` (`B`) | `fps` | Nominal playback frame rate (`8..60`, e.g. `20–24` on `sram`, `24–30` on `psram`/`psram_hd`) |
        | `6..7` | `uint16le` (`H`) | `width` | Panel width in pixels (`128`, `256`, etc.) |
        | `8..9` | `uint16le` (`H`) | `height` | Panel height in pixels (`32`, `64`, etc.) |
        | `10..11` | `uint16le` (`H`) | `total_frames` | Total frames in the stream (`1..65535`) |
        | `12..13` | `uint16le` (`H`) | `frame_dur_ms` | Nominal frame duration in ms (`round(1000 / fps)`) |
        | `14..15` | `uint16le` (`H`) | `keyframe_interval` | Keyframe cadence (`0` = frame `0` keyframe) |
      payload:
        type: string
        format: binary
        minLength: 16
        maxLength: 1400
        x-binary-header-format: "<4sBBHHHHH"

    DmdzWsFrameSubpacketMessage:
      name: DmdzWsFrameSubpacketMessage
      title: Binary DMDZ (`v1` / `v2`) Frame Sub-Packet (`<= chunk` Bytes, `256..1,400`)
      contentType: application/octet-stream
      summary: "`<= chunk`-byte binary WebSocket slice of `<H` `payload_len` + `dmdz1` / `dmdz2` (including `FRAME_PAL8` `0x05`) frame operations."
      description: |
        Each `DMDZ` frame consists of a 2-byte Little-Endian `<H` `payload_len` followed by `payload_len` bytes:
        - `byte[0]` (`frame_type`):
          - `0` (`FRAME_DELTA`): delta against previous frame
          - `1` (`FRAME_SCROLL`): 1D vertical scroll `int8 dy` via in-place `memmove` + delta
          - `2` (`FRAME_KEY`): keyframe (`cache[64]` + `last=0`)
          - `3` (`FRAME_SCROLL_2D`, `v=2`): 2D scroll `<bb` `(dx, dy)` via in-place `memmove` + `v2` ops (`OP_LUMA`, `OP_TLUMA`, `OP_LZ`, `OP_TDIFF`)
          - `4` (`FRAME_RAW`, `v=2`): uncompressed `width * height * 2` RGB565LE cap
          - `5` (`FRAME_PAL8`, `v=2`, `profile=sram`): hybrid scene-palette codec (`<= 1,400 B` ceiling):
            - `byte[1]`: `pal_hdr = (0x80 if has_scroll_2d else 0x00) | ((pal_count - 1) & 0x7F)` (`1..128` RGB565 colors)
            - optional `bytes[2..3]` (iff `has_scroll_2d`): `<bb` `(dx, dy)` 2D reference scroll
            - `pal_count * 2` bytes: `<u2` RGB565 scene palette
            - op stream (`pos=0`, `last_color=palette[0]`): `0x00..0x7F` `PAL_INDEX`, `0x80..0xBF` `PAL_SKIP (1..64)`, `0xC0..0xFE` `PAL_RUN (2..64)`, `0xFF + <H` `PAL_LONG_SKIP`

        Frames exceeding `chunk` bytes (`1,360 B` on `profile=sram`, `1,400 B` on `profile=psram|psram_hd`) are split across sequential
        WebSocket binary messages with a `2 ms` inter-chunk pace on `profile=sram` (`0 ms` on `psram` / `psram_hd`).
      payload:
        type: string
        format: binary
        minLength: 1
        maxLength: 1400

    DmdzWsCreditAckMessage:
      name: DmdzWsCreditAckMessage
      title: Client-to-Server 1-Byte Credit ACK (`'A'` / `0x41`)
      contentType: application/octet-stream
      summary: 1-byte `'A'` (`0x41`) flow-control credit ACK returned by the DMD client per drained binary WebSocket message.
      description: |
        Each byte received from the client replenishes `1` server send credit (in raw RFC 6455 client-to-server wire form,
        a 7-byte masked binary frame `0x82 0x81 <4B mask> <0x41 ^ mask[0]>`). Returning `1` credit only after `lwip_recv()`
        drains the message into stack/framebuffer memory guarantees zero TCP receive-window overflow and zero LwIP `ooseq`
        heap allocations on Classic ESP32 (`0 KB` PSRAM).
      payload:
        type: string
        format: binary
        minLength: 1
        maxLength: 16

    DmdfUdpDatagram:
      name: DmdfUdpDatagram
      title: Binary DMDF UDP Frame Chunk Datagram
      contentType: application/octet-stream
      summary: 10-byte Little-Endian `<4sHBBH` header + `<= 1408`-byte RGB565LE framebuffer slice (`<= 1418` bytes/UDP packet).
      description: |
        > **Transport Note**: Models 1 & 2A (`supports_local_card: true`) use **`MQTT+TCP` (`mqtt_tcp`) by default** — streaming
        > credit-acknowledged lossless `DMDZ` v1 frames over **`WS /api/v1/{domain}/ws/{item_id}.dmdz`** on constrained `ESP32` /
        > `ESP32-S3` boards, with automatic paced HTTP TCP fallback (`GET /api/v1/{domain}/stream/{item_id}.rgb565.stream?purge=true&paced=1&codec=dmdz1`,
        > documented in `/openapi.json`) and unpaced raw `DMDS` HTTP preload on `ArcadeMatrix_RPi`.
        > The UDP `DMDF` datagram format below powers **Model 2B Passive Receivers (`UDP-PASSIVE :4210`, `supports_local_card: false`)**
        > and optional `mqtt_udp` sessions.

        Each video or panorama frame (`width * height * 2` bytes of Little-Endian RGB565 pixels, e.g. `8192` bytes
        for `128x32` = `6` chunks of `<= 1408` bytes fitting ESP32 `UDP_RECVMBOX_SIZE=6` & `kRxBaWin=6`) is split into MTU-safe UDP datagrams packed in Little-Endian
        (`struct.pack("<4sHBBH", b"DMDF", frame_seq, chunk_idx, total_chunks, byte_offset) + payload`):

        | Byte Offset | C / Struct Type | Field | Constraints & Semantics |
        | :--- | :--- | :--- | :--- |
        | `0..3` | `char[4]` (`4s`) | `magic` | ASCII `"DMDF"` (`0x44 0x4D 0x44 0x46`) |
        | `4..5` | `uint16le` (`H`) | `frame_seq` | Wrapping monotonic frame counter (`0..65535`) |
        | `6` | `uint8` (`B`) | `chunk_idx` | Zero-based chunk index within `frame_seq` (`0 .. total_chunks - 1`) |
        | `7` | `uint8` (`B`) | `total_chunks` | Total chunks forming the complete frame (`1..64`) |
        | `8..9` | `uint16le` (`H`) | `byte_offset` | Destination byte offset (`chunk_idx * 1408`) in RGB565LE framebuffer |
        | `10..N` | `uint8[<=1408]` | `payload` | Raw Little-Endian RGB565 pixel bytes (`1..1408` bytes) |

        **Reassembly & Watchdog Contract (Mode 2B Passive ESP32 & Optional `mqtt_udp`)**:
        - Copy `payload` directly into `framebuffer_bytes[byte_offset .. byte_offset + len(payload)]` if bounds-valid
          and `total_chunks <= 64`.
        - Set bit `(1 << chunk_idx)` in a 64-bit `chunk_mask`; commit the frame when `chunk_mask == (1 << total_chunks) - 1`
          (or flush partial non-zero `chunk_mask` if `frame_seq` advances on minor Wi-Fi packet loss).
        - On optional `mqtt_udp` clients, combine MQTT `stream_eof` with a local `2,500 ms` UDP inactivity watchdog
          (`millis() - lastUdpPacketMs > 2500`) and fall back to paced HTTP TCP `DMDS`
          (`/api/v1/{domain}/stream/{item_id}.rgb565.stream?purge=true&paced=1&drop_late=1`) if VM NAT blocks UDP.
      payload:
        type: string
        format: binary
        minLength: 12
        maxLength: 1418
        x-binary-header-format: "<4sHBBH"
        x-binary-header-bytes: 10
        x-max-payload-bytes: 1408
        x-header-fields:
          magic:
            offset: 0
            size: 4
            type: ascii
            const: DMDF
          frame_seq:
            offset: 4
            size: 2
            type: uint16le
          chunk_idx:
            offset: 6
            size: 1
            type: uint8
          total_chunks:
            offset: 7
            size: 1
            type: uint8
            minimum: 1
            maximum: 64
          byte_offset:
            offset: 8
            size: 2
            type: uint16le
          payload:
            offset: 10
            maxSize: 1408
            type: rgb565le
