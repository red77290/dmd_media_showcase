[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmd-media-showcase"
version = "1.0.0"
description = "DDD Media Showcase & Real-Time MQTT+UDP / HTTP Streaming Server (Games, Movies, TV Series, Anime) for HUB75 LED Matrices"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "red77290" }
]
keywords = ["dmd", "hub75", "led-matrix", "arcade", "retrogaming", "tmdb", "screenscraper", "mqtt", "udp", "fastapi", "esp32", "raspberry-pi"]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "opencv-python-headless>=4.9.0",
    "yt-dlp>=2024.5.0",
    "dmd-gif-converter @ git+https://github.com/red77290/dmd_gif_converter.git@latest",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "pyinstaller>=6.6.0",
]

[project.scripts]
dmd-media-showcase = "app.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
"app.security" = ["*.so", "*.pyd"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 110
target-version = "py311"
