services:
  dmd-media-showcase:
    image: ghcr.io/red77290/dmd-media-showcase:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dmd-media-showcase
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      - DEFAULT_LANG=${DEFAULT_LANG:-fr}
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-2}
      - FFMPEG_THREADS_PER_JOB=${FFMPEG_THREADS_PER_JOB:-1}
      - WORKER_NICE_INCREMENT=${WORKER_NICE_INCREMENT:-10}
      - BATCH_TTL_SECONDS=${BATCH_TTL_SECONDS:-180}
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-1200}
      - SERVER_MASTER_CLIP_MAX_S=${SERVER_MASTER_CLIP_MAX_S:-12.0}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - SCREENSCRAPER_USER=${SCREENSCRAPER_USER:-}
      - SCREENSCRAPER_PASS=${SCREENSCRAPER_PASS:-}
      - SCREENSCRAPER_DEV_ID=${SCREENSCRAPER_DEV_ID:-}
      - SCREENSCRAPER_DEV_PASS=${SCREENSCRAPER_DEV_PASS:-}
      - TVDB_API_KEY=${TVDB_API_KEY:-}
    tmpfs:
      # Ephemeral RAM-backed cache: zero SD/SSD wear and automatic cleanup
      - /tmp/dmd_media_showcase_cache:size=256m,mode=1777
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
