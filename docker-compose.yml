services:
  dmd-media-showcase:
    image: ghcr.io/red77290/dmd_media_showcase:latest
    pull_policy: always
    container_name: dmd-media-showcase
    restart: unless-stopped
    ports:
      - "${PORT:-8890}:8890"
      - "${MQTT_PORT:-1883}:1883"
      - "5353:5353/udp"
    env_file:
      - path: .env
        required: false
    environment:
      - DEFAULT_LANG
      - HOST_LAN_IP
      - MQTT_MODE
      - MQTT_PORT
      - MQTT_EXTERNAL_URL
      - MAX_CONCURRENT_JOBS
      - FFMPEG_THREADS_PER_JOB
      - WORKER_NICE_INCREMENT
      - SERVER_MASTER_CLIP_MAX_S
      - TMDB_API_KEY
      - TVDB_API_KEY
      - SCREENSCRAPER_USER
      - SCREENSCRAPER_PASS
      - SCREENSCRAPER_DEV_ID
      - SCREENSCRAPER_DEV_PASS
    volumes:
      # Persistent volume for server_config.json, dmd_profiles.json, seen_history.json & referentials/
      # Survives `docker compose down`, `docker compose down -v`, and image rebuilds/pulls.
      - ${DMD_DATA_PATH:-./data}:/app/data
    tmpfs:
      - /tmp/dmd_media_showcase_cache:size=512m,mode=1777
    deploy:
      resources:
        limits:
          memory: 2048M
