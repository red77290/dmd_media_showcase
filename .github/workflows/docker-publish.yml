name: Publish Multi-Arch Docker Image (GHCR)

on:
  push:
    branches: ["main", "master", "feat/**"]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build & Push Multi-Arch Image (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for arm64 emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=SNAPSHOT,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Resolve latest dmd_gif_converter tag SHA for Docker cache invalidation
        id: converter_rev
        run: |
          CONV_SHA=$(git ls-remote https://github.com/red77290/dmd_gif_converter.git refs/tags/latest | awk '{print $1}')
          if [ -z "$CONV_SHA" ]; then
            CONV_SHA=$(git ls-remote https://github.com/red77290/dmd_gif_converter.git refs/heads/main | awk '{print $1}')
          fi
          echo "sha=${CONV_SHA:-latest}" >> "$GITHUB_OUTPUT"
          echo "Resolved dmd_gif_converter@latest -> ${CONV_SHA:-latest}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DMD_GIF_CONVERTER_REV=${{ steps.converter_rev.outputs.sha }}
          secrets: |
            "VAULT_MASTER_SECRET=${{ secrets.VAULT_MASTER_SECRET }}"
            "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}"
            "TVDB_API_KEY=${{ secrets.TVDB_API_KEY }}"
            "SCREENSCRAPER_DEV_ID=${{ secrets.SCREENSCRAPER_DEV_ID }}"
            "SCREENSCRAPER_DEV_PASS=${{ secrets.SCREENSCRAPER_DEV_PASS }}"
            "IGDB_CLIENT_ID=${{ secrets.IGDB_CLIENT_ID }}"
            "IGDB_CLIENT_SECRET=${{ secrets.IGDB_CLIENT_SECRET }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max
