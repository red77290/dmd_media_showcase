name: CI, Portable Bundles & Snapshot Pre-Release

on:
  push:
    branches: ["main", "master", "feat/**"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: write

jobs:
  test:
    name: Pytest Matrix (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system FFmpeg & OpenCV runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libglib2.0-0 libsm6 libxext6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install ".[dev]"

      - name: Run full DDD, MQTT Retain/LWT, UDP DMDF & Consume-Once test suite
        run: |
          pytest

  portable:
    name: Build Hermetic Portable Package (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: portable-windows-x64
          - os: macos-14
            artifact_name: portable-macos-arm64
          - os: ubuntu-latest
            artifact_name: portable-linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Ensure FFmpeg & FFprobe are available (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Ensure FFmpeg & FFprobe are available (macOS)
        if: runner.os == 'macOS'
        run: |
          which ffmpeg && which ffprobe || brew install ffmpeg

      - name: Ensure FFmpeg & FFprobe are available (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          ffmpeg -version
          ffprobe -version

      - name: Build hermetic portable bundle (PyInstaller + bundled FFmpeg + MQTT broker)
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install "."
          python scripts/build_portable.py

      - name: Upload portable zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/DMD_Media_Showcase_Portable_*.zip

  snapshot:
    name: Publish v3.0.0-SNAPSHOT Pre-Release (Wheels + Portable Bundles)
    needs: [test, portable]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Download portable archives from matrix jobs
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Publish or Update v3.0.0-SNAPSHOT Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0-SNAPSHOT
          name: "dmd-media-showcase v3.0.0-SNAPSHOT (DDD + MQTT/UDP + Hermetic Portable)"
          body: |
            Automated rolling V3.0 snapshot built from commit `${{ github.sha }}` on branch `${{ github.ref_name }}`.
            - **Hermetic Portable Packages** for **Windows x64**, **macOS Apple Silicon (arm64)**, and **Linux x64** (bundling Python, static `ffmpeg`/`ffprobe`, `dmd_gif_converter`, `yt-dlp`, and the embedded MQTT `:1883` broker).
            - **DDD Ports & Adapters**: 2 dedicated sources per domain (`Primary` + `Fallback`), strict `Consume-Once` (`seen_history.json`), and real-time `ffmpeg -re` UDP `DMDF` streaming.
          prerelease: true
          files: dist/*
