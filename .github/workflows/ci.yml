name: CI, Portable Bundles & Snapshot Pre-Release

on:
  push:
    branches: ["main", "master", "feat/**"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: write

jobs:
  test:
    name: Pytest Matrix (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system FFmpeg & OpenCV runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libglib2.0-0 libsm6 libxext6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install ".[dev]"
          python -m pip install --no-cache-dir --force-reinstall --no-deps "dmd-gif-converter @ git+https://github.com/red77290/dmd_gif_converter.git@latest"
          python -c "import dmd_gif_converter as c; print('Installed dmd_gif_converter@latest:', c.__version__)"

      - name: Run full Showcase, MQTT Retain/LWT, UDP DMDF & Consume-Once test suite
        run: |
          pytest

  portable:
    name: Build Hermetic Portable Package (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: portable-windows-x64
          - os: macos-14
            artifact_name: portable-macos-arm64
          - os: ubuntu-latest
            artifact_name: portable-linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Ensure FFmpeg & FFprobe are available (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libglib2.0-0 libsm6 libxext6

      - name: Ensure FFmpeg & FFprobe are available (macOS)
        if: runner.os == 'macOS'
        run: |
          which ffmpeg && which ffprobe || brew install ffmpeg

      - name: Ensure FFmpeg & FFprobe are available (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not ((Get-Command ffmpeg -ErrorAction SilentlyContinue) -and (Get-Command ffprobe -ErrorAction SilentlyContinue))) {
            $ffRoot = Join-Path $env:RUNNER_TEMP "ffmpeg-static"
            $ffZip = Join-Path $env:RUNNER_TEMP "ffmpeg-win64.zip"
            $ffBin = Join-Path $ffRoot "bin"
            New-Item -ItemType Directory -Force -Path $ffBin | Out-Null

            $mirrors = @(
              "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip",
              "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
            )

            $downloaded = $false
            foreach ($url in $mirrors) {
              for ($attempt = 1; $attempt -le 3; $attempt++) {
                try {
                  Write-Host "[FFMPEG] Downloading static Windows x64 archive from $url (attempt $attempt/3)..."
                  $headers = @{ "User-Agent" = "dmd-media-showcase-ci" }
                  if ($url -like "https://github.com/*" -and $env:GH_TOKEN) {
                    $headers["Authorization"] = "Bearer $env:GH_TOKEN"
                  }
                  Invoke-WebRequest -Uri $url -Headers $headers -OutFile $ffZip -TimeoutSec 120 -MaximumRetryCount 2 -RetryIntervalSec 3
                  if ((Test-Path $ffZip) -and ((Get-Item $ffZip).Length -gt 10000000)) {
                    $downloaded = $true
                    break
                  }
                } catch {
                  Write-Warning "[FFMPEG] Mirror attempt $attempt failed for ${url}: $($_.Exception.Message)"
                  Start-Sleep -Seconds (3 * $attempt)
                }
              }
              if ($downloaded) { break }
            }

            if ($downloaded) {
              $extractDir = Join-Path $ffRoot "extracted"
              if (Test-Path $extractDir) { Remove-Item -Recurse -Force $extractDir }
              Expand-Archive -Path $ffZip -DestinationPath $extractDir -Force
              $ffmpegExe = Get-ChildItem -Path $extractDir -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
              $ffprobeExe = Get-ChildItem -Path $extractDir -Filter "ffprobe.exe" -Recurse | Select-Object -First 1
              if (-not $ffmpegExe -or -not $ffprobeExe) {
                throw "Extracted FFmpeg archive did not contain both ffmpeg.exe and ffprobe.exe"
              }
              Copy-Item -Path $ffmpegExe.FullName -Destination (Join-Path $ffBin "ffmpeg.exe") -Force
              Copy-Item -Path $ffprobeExe.FullName -Destination (Join-Path $ffBin "ffprobe.exe") -Force
              Remove-Item -Force $ffZip -ErrorAction SilentlyContinue
              Remove-Item -Recurse -Force $extractDir -ErrorAction SilentlyContinue
              Add-Content -Path $env:GITHUB_PATH -Value $ffBin
              $env:PATH = "$ffBin;$env:PATH"
            } else {
              Write-Warning "[FFMPEG] Static mirrors unavailable; falling back to Chocolatey..."
              choco install ffmpeg -y --no-progress --execution-timeout=180
            }
          }
          ffmpeg -version
          ffprobe -version

      - name: Compile optional CI/CD Production Native Vault & Build hermetic portable bundle
        shell: bash
        env:
          VAULT_MASTER_SECRET: ${{ secrets.VAULT_MASTER_SECRET }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
          SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
          SCREENSCRAPER_DEV_PASS: ${{ secrets.SCREENSCRAPER_DEV_PASS }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          python - <<'PY'
          import os, re, tomllib
          from pathlib import Path

          ref = os.environ.get("GITHUB_REF", "")
          ref_name = os.environ.get("GITHUB_REF_NAME", "")
          if ref.startswith("refs/tags/v"):
              raw_ver = ref_name.removeprefix("v")
              pep_ver = re.sub(r"-snapshot$", ".dev0", raw_ver, flags=re.I)
              for rel_path, pattern, repl in [
                  ("pyproject.toml", r'^version = ".*"', f'version = "{pep_ver}"'),
                  ("app/__init__.py", r'^__version__ = ".*"', f'__version__ = "{raw_ver}"'),
              ]:
                  p = Path(rel_path)
                  p.write_text(
                      re.sub(pattern, repl, p.read_text(encoding="utf-8"), count=1, flags=re.M),
                      encoding="utf-8",
                  )
              assert tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"] == pep_ver
              print(f"Stamped release version: {raw_ver} (PEP 440: {pep_ver})")
          PY
          python -m pip install --upgrade pip setuptools pyinstaller pillow
          python scripts/compile_prod_vault.py
          python -m pip install "."
          python -m pip install --no-cache-dir --force-reinstall --no-deps "dmd-gif-converter @ git+https://github.com/red77290/dmd_gif_converter.git@latest"
          python -c "import dmd_gif_converter as c; print('Bundled dmd_gif_converter@latest:', c.__version__)"
          python scripts/build_portable.py

      - name: Upload native installer or portable package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            dist/DMD_Media_Showcase_*.dmg
            dist/DMD_Media_Showcase_*.zip
            dist/DMD_Media_Showcase_*.tar.gz

  snapshot:
    name: Publish GitHub Release or SNAPSHOT (Wheels + Portable Bundles)
    needs: [test, portable]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stamp version from release tag (if tag push) & Build wheel and sdist
        run: |
          python - <<'PY'
          import os, re, tomllib
          from pathlib import Path

          ref = os.environ.get("GITHUB_REF", "")
          ref_name = os.environ.get("GITHUB_REF_NAME", "")
          if ref.startswith("refs/tags/v"):
              raw_ver = ref_name.removeprefix("v")
              pep_ver = re.sub(r"-snapshot$", ".dev0", raw_ver, flags=re.I)
              for rel_path, pattern, repl in [
                  ("pyproject.toml", r'^version = ".*"', f'version = "{pep_ver}"'),
                  ("app/__init__.py", r'^__version__ = ".*"', f'__version__ = "{raw_ver}"'),
              ]:
                  p = Path(rel_path)
                  p.write_text(
                      re.sub(pattern, repl, p.read_text(encoding="utf-8"), count=1, flags=re.M),
                      encoding="utf-8",
                  )
              assert tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"] == pep_ver
              print(f"Stamped release version: {raw_ver} (PEP 440: {pep_ver})")
          PY
          python -m pip install --upgrade pip build
          python -m build

      - name: Download portable archives from matrix jobs
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Publish Official GitHub Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "dmd-media-showcase ${{ github.ref_name }}"
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*

      - name: Prune obsolete legacy Portable_*.zip assets from SNAPSHOT release
        if: "!startsWith(github.ref, 'refs/tags/v')"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for asset in DMD_Media_Showcase_Portable_macOS_arm64.zip DMD_Media_Showcase_Portable_Windows_x64.zip DMD_Media_Showcase_Portable_Linux_x64.zip; do
            gh release delete-asset SNAPSHOT "$asset" --yes --repo "${GITHUB_REPOSITORY}" 2>/dev/null || true
          done

      - name: Publish or Update Rolling SNAPSHOT Pre-Release (on branch push)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: SNAPSHOT
          name: "dmd-media-showcase SNAPSHOT (Latest CI Build — ${{ github.ref_name }})"
          body: |
            Automated rolling snapshot built from commit `${{ github.sha }}` on branch `${{ github.ref_name }}`.
            - **Native Installers & Portable Packages**: **macOS Apple Silicon `.dmg`** (`DMD Media Showcase.app` Menu-Bar app), **Windows x64 `.zip`**, and **Linux x64 `.tar.gz`** (bundling Python, `ffmpeg`/`ffprobe`, `dmd_gif_converter`, `yt-dlp`, and the embedded MQTT `:1883` broker).
            - **Configurable Multi-Source Chains & Cross-Source Aggregation**: Hot-reconfigurable per-domain scraper chains (`IGDB v4`, `ScreenScraper`, `ArcadeItalia`, `Libretro/Wikidata`, `TMDB`, `Apple iTunes`, `TheTVDB v4`, `TVMaze`, `Jikan/AnimeThemes`, `AniList`), `CandidateAggregator` asset enrichment, **66 retro/arcade systems**, strict `Consume-Once` (`seen_history.json`), and real-time `ffmpeg -re` UDP `DMDF` streaming.
          prerelease: true
          files: dist/*
