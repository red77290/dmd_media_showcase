name: CI, Portable Bundles & Snapshot Pre-Release

on:
  push:
    branches: ["main", "master", "feat/**"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: write

jobs:
  test:
    name: Pytest Matrix (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system FFmpeg & OpenCV runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libglib2.0-0 libsm6 libxext6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install ".[dev]"

      - name: Run full DDD, MQTT Retain/LWT, UDP DMDF & Consume-Once test suite
        run: |
          pytest

  portable:
    name: Build Hermetic Portable Package (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: portable-windows-x64
          - os: macos-14
            artifact_name: portable-macos-arm64
          - os: ubuntu-latest
            artifact_name: portable-linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Ensure FFmpeg & FFprobe are available (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Ensure FFmpeg & FFprobe are available (macOS)
        if: runner.os == 'macOS'
        run: |
          which ffmpeg && which ffprobe || brew install ffmpeg

      - name: Ensure FFmpeg & FFprobe are available (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          ffmpeg -version
          ffprobe -version

      - name: Compile optional CI/CD Production Native Vault & Build hermetic portable bundle
        env:
          VAULT_MASTER_SECRET: ${{ secrets.VAULT_MASTER_SECRET }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
          SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
          SCREENSCRAPER_DEV_PASS: ${{ secrets.SCREENSCRAPER_DEV_PASS }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            REL_VER="${GITHUB_REF_NAME#v}"
            python -c "from pathlib import Path; import re; p=Path('pyproject.toml'); p.write_text(re.sub(r'^version = \".*\"', f'version = \"{REL_VER}\"', p.read_text(), count=1, flags=re.M)); a=Path('app/__init__.py'); a.write_text(re.sub(r'__version__ = \".*\"', f'__version__ = \"{REL_VER}\"', a.read_text()))"
          fi
          python -m pip install --upgrade pip setuptools pyinstaller
          python scripts/compile_prod_vault.py
          python -m pip install "."
          python scripts/build_portable.py

      - name: Upload portable zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/DMD_Media_Showcase_Portable_*.zip

  snapshot:
    name: Publish GitHub Release or SNAPSHOT (Wheels + Portable Bundles)
    needs: [test, portable]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stamp version from release tag (if tag push) & Build wheel and sdist
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            REL_VER="${GITHUB_REF_NAME#v}"
            python -c "from pathlib import Path; import re; p=Path('pyproject.toml'); p.write_text(re.sub(r'^version = \".*\"', f'version = \"{REL_VER}\"', p.read_text(), count=1, flags=re.M)); a=Path('app/__init__.py'); a.write_text(re.sub(r'__version__ = \".*\"', f'__version__ = \"{REL_VER}\"', a.read_text()))"
          fi
          python -m pip install --upgrade pip build
          python -m build

      - name: Download portable archives from matrix jobs
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Publish Official GitHub Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "dmd-media-showcase ${{ github.ref_name }}"
          generate_release_notes: true
          prerelease: false
          files: dist/*

      - name: Publish or Update Rolling SNAPSHOT Pre-Release (on branch push)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: SNAPSHOT
          name: "dmd-media-showcase SNAPSHOT (Latest CI Build — ${{ github.ref_name }})"
          body: |
            Automated rolling snapshot built from commit `${{ github.sha }}` on branch `${{ github.ref_name }}`.
            - **Hermetic Portable Packages** for **Windows x64**, **macOS Apple Silicon (arm64)**, and **Linux x64** (bundling Python, static `ffmpeg`/`ffprobe`, `dmd_gif_converter`, `yt-dlp`, and the embedded MQTT `:1883` broker).
            - **DDD Ports & Adapters**: 2 dedicated sources per domain (`Primary` + `Fallback`), strict `Consume-Once` (`seen_history.json`), and real-time `ffmpeg -re` UDP `DMDF` streaming.
          prerelease: true
          files: dist/*
